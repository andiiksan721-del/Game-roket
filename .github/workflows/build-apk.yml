name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Prepare www
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Sync Capacitor Android
        run: |
          if [ -d android ]; then
            npx cap sync android
          else
            npx cap add android
            npx cap sync android
          fi

      - name: Patch Manifest (INTERNET + WebGL + cleartext)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q "ACCESS_NETWORK_STATE" "$MANIFEST" || sed -i 's|<application|<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>\n    <application|' "$MANIFEST"
          grep -q "hardwareAccelerated" "$MANIFEST" || sed -i 's|<application|<application android:hardwareAccelerated="true"|' "$MANIFEST"
          grep -q "usesCleartextTraffic" "$MANIFEST" || sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$MANIFEST"
          cat "$MANIFEST"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
